[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indicsql"
version = "0.1.0"
description = "Autonomous Multi-Agent Cross-Lingual Text-to-SQL & Semantic Schema-Linking Swarm for Indian Languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Prathmesh Ojha", email = "ojhaprathmesh@example.com" }
]
keywords = [
    "text-to-sql",
    "indic-nlp",
    "multi-agent",
    "langgraph",
    "indicdb",
    "duckdb",
    "cross-lingual",
    "schema-linking"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.9.0",
    "pyarrow>=16.0.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "accelerate>=0.30.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece>=0.2.0",
    "sentence-transformers>=3.0.0"
]
eval = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "tqdm>=4.66.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "black>=24.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["indicsql*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
